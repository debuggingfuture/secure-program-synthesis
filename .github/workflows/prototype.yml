name: prototype

on:
  push:
    branches: [main]
    paths: ["prototype/**", ".github/workflows/prototype.yml"]
  pull_request:
    paths: ["prototype/**", ".github/workflows/prototype.yml"]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototype
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: cargo test (datalog-biscuit feature)
        run: cargo test -p postern-core --features datalog-biscuit
      - name: cargo clippy (datalog-biscuit feature)
        run: cargo clippy -p postern-core --features datalog-biscuit -- -D warnings
      - name: conformance test against committed corpus
        run: cargo run -p postern-diff -- corpus/postern-corpus.json
