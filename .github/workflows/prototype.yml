name: prototype

on:
  push:
    branches: [main]
    paths: ["prototype/**", ".github/workflows/prototype.yml"]
  pull_request:
    paths: ["prototype/**", ".github/workflows/prototype.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest -q
      - run: uv run ruff check src tests
