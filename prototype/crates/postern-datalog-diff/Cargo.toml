[package]
name = "postern-datalog-diff"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "postern-datalog-diff"
path = "src/main.rs"

[dependencies]
# Forces the biscuit Datalog backend on — this is a conformance
# harness, the whole point is to exercise it.
postern-core = { path = "../postern-core", features = ["datalog-biscuit"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
