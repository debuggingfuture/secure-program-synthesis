[project]
name = "vapor-prototype"
version = "0.0.1"
description = "Dataframe gateway prototype for VAPOR — verified access policy over retrieval."
requires-python = ">=3.11"
dependencies = [
  "ibis-framework[duckdb]>=9.5",
  "polars>=1.0",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
