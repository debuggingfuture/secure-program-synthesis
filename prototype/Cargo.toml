[workspace]
resolver = "2"
members = [
    "crates/postern-core",
    "crates/postern-diff",
    "crates/postern-datalog-diff",
    "crates/postern-guardrail",
    "crates/postern-wasm",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
